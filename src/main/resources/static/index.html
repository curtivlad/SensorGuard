<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SensorGuard - Real-time Monitoring</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            background: white;
            padding: 20px 30px;
            border-radius: 15px;
            margin-bottom: 20px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h1 {
            color: #667eea;
            font-size: 2em;
        }

        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9em;
            margin-left: 20px;
        }

        .status.connected {
            background: #10b981;
            color: white;
        }

        .status.disconnected {
            background: #ef4444;
            color: white;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        h2 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .sensor-item {
            padding: 15px;
            margin: 10px 0;
            background: #f8fafc;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        .sensor-name {
            font-weight: bold;
            color: #1e293b;
        }

        .sensor-type {
            color: #64748b;
            font-size: 0.9em;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            color: #475569;
            font-weight: 500;
        }

        select, input {
            width: 100%;
            padding: 10px;
            border: 2px solid #e2e8f0;
            border-radius: 8px;
            font-size: 1em;
        }

        select:focus, input:focus {
            outline: none;
            border-color: #667eea;
        }

        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s;
        }

        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }

        button:active {
            transform: translateY(0);
        }

        .alert {
            padding: 15px;
            margin: 10px 0;
            border-radius: 10px;
            animation: slideIn 0.3s;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateX(-20px);
            }
            to {
                opacity: 1;
                transform: translateX(0);
            }
        }

        .alert.CRITICAL {
            background: #fee2e2;
            border-left: 4px solid #dc2626;
        }

        .alert.HIGH {
            background: #fed7aa;
            border-left: 4px solid #ea580c;
        }

        .alert.MEDIUM {
            background: #fef3c7;
            border-left: 4px solid #f59e0b;
        }

        .alert.LOW {
            background: #dbeafe;
            border-left: 4px solid #3b82f6;
        }

        .alert-time {
            font-size: 0.85em;
            color: #64748b;
        }

        .reading {
            padding: 12px;
            margin: 8px 0;
            background: #f1f5f9;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .reading.anomaly {
            background: #fee2e2;
            border-left: 3px solid #dc2626;
        }

        .badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }

        .badge.anomaly {
            background: #dc2626;
            color: white;
        }

        .badge.normal {
            background: #10b981;
            color: white;
        }

        #readings {
            max-height: 400px;
            overflow-y: auto;
        }

        #alerts {
            max-height: 400px;
            overflow-y: auto;
        }
    </style>
</head>
<body>
<div class="container">
    <header>
        <h1>🛡️ SensorGuard</h1>
        <span class="status" id="wsStatus">Connecting...</span>
    </header>

    <div class="grid">
        <!-- Sensors List -->
        <div class="card">
            <h2>📊 Active Sensors</h2>
            <div id="sensors">Loading sensors...</div>
        </div>

        <!-- Ingest Data -->
        <div class="card">
            <h2>📥 Ingest Sensor Data</h2>
            <form id="ingestForm">
                <div class="form-group">
                    <label for="sensorSelect">Select Sensor:</label>
                    <select id="sensorSelect" required>
                        <option value="">-- Select Sensor --</option>
                    </select>
                </div>
                <div class="form-group">
                    <label for="valueInput">Value:</label>
                    <input type="number" id="valueInput" step="0.01" required placeholder="Enter value">
                </div>
                <button type="submit">Submit Reading</button>
            </form>
        </div>

        <!-- Recent Readings -->
        <div class="card">
            <h2>📈 Recent Readings</h2>
            <div id="readings">No readings yet...</div>
        </div>

        <!-- Alerts -->
        <div class="card">
            <h2>🚨 Alerts</h2>
            <div id="alerts">No alerts yet...</div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sockjs-client@1/dist/sockjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>
<script>
    const API_BASE = window.location.origin;
    let stompClient = null;
    const maxReadings = 10;
    const maxAlerts = 10;

    // Load sensors on page load
    async function loadSensors() {
        try {
            const response = await fetch(`${API_BASE}/api/sensors`);
            const sensors = await response.json();

            const sensorsDiv = document.getElementById('sensors');
            const sensorSelect = document.getElementById('sensorSelect');

            sensorsDiv.innerHTML = '';
            sensorSelect.innerHTML = '<option value="">-- Select Sensor --</option>';

            sensors.forEach(sensor => {
                // Display sensor
                const sensorItem = document.createElement('div');
                sensorItem.className = 'sensor-item';
                sensorItem.innerHTML = `
                        <div class="sensor-name">${sensor.name}</div>
                        <div class="sensor-type">${sensor.type} (${sensor.sensorId}) - ${sensor.unit}</div>
                    `;
                sensorsDiv.appendChild(sensorItem);

                // Add to select
                const option = document.createElement('option');
                option.value = sensor.sensorId;
                option.textContent = `${sensor.name} (${sensor.type})`;
                sensorSelect.appendChild(option);
            });
        } catch (error) {
            console.error('Error loading sensors:', error);
            document.getElementById('sensors').innerHTML = '<p style="color: red;">Error loading sensors</p>';
        }
    }

    // Submit reading
    document.getElementById('ingestForm').addEventListener('submit', async (e) => {
        e.preventDefault();

        const sensorId = document.getElementById('sensorSelect').value;
        const value = parseFloat(document.getElementById('valueInput').value);

        try {
            const response = await fetch(`${API_BASE}/api/readings/ingest`, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({ sensorId, value })
            });

            if (response.ok) {
                document.getElementById('valueInput').value = '';
                alert('✅ Reading submitted successfully!');
            } else {
                alert('❌ Error submitting reading');
            }
        } catch (error) {
            console.error('Error:', error);
            alert('❌ Error submitting reading');
        }
    });

    // WebSocket connection
    function connect() {
        const socket = new SockJS(`${API_BASE}/ws`);
        stompClient = Stomp.over(socket);

        stompClient.connect({}, function(frame) {
            console.log('Connected: ' + frame);
            document.getElementById('wsStatus').textContent = 'Connected';
            document.getElementById('wsStatus').className = 'status connected';

            // Subscribe to readings
            stompClient.subscribe('/topic/readings', function(message) {
                const data = JSON.parse(message.body);
                addReading(data.payload);
            });

            // Subscribe to alerts
            stompClient.subscribe('/topic/alerts', function(message) {
                const data = JSON.parse(message.body);
                addAlert(data.payload);
            });
        }, function(error) {
            console.log('WebSocket error:', error);
            document.getElementById('wsStatus').textContent = 'Disconnected';
            document.getElementById('wsStatus').className = 'status disconnected';

            // Retry connection after 5 seconds
            setTimeout(connect, 5000);
        });
    }

    function addReading(reading) {
        const readingsDiv = document.getElementById('readings');

        const readingEl = document.createElement('div');
        readingEl.className = reading.isAnomaly ? 'reading anomaly' : 'reading';
        readingEl.innerHTML = `
                <div>
                    <strong>${reading.sensorName}</strong><br>
                    <small>${new Date(reading.timestamp).toLocaleString()}</small>
                </div>
                <div>
                    <strong>${reading.value.toFixed(2)} ${reading.sensorType}</strong>
                    <span class="badge ${reading.isAnomaly ? 'anomaly' : 'normal'}">
                        ${reading.isAnomaly ? '⚠️ ANOMALY' : '✓ Normal'}
                    </span>
                </div>
            `;

        readingsDiv.insertBefore(readingEl, readingsDiv.firstChild);

        // Keep only last N readings
        while (readingsDiv.children.length > maxReadings) {
            readingsDiv.removeChild(readingsDiv.lastChild);
        }
    }

    function addAlert(alert) {
        const alertsDiv = document.getElementById('alerts');

        const alertEl = document.createElement('div');
        alertEl.className = `alert ${alert.severity}`;
        alertEl.innerHTML = `
                <div><strong>${alert.severity}</strong> - ${alert.sensorName}</div>
                <div>${alert.message}</div>
                <div class="alert-time">${new Date(alert.createdAt).toLocaleString()}</div>
            `;

        alertsDiv.insertBefore(alertEl, alertsDiv.firstChild);

        // Keep only last N alerts
        while (alertsDiv.children.length > maxAlerts) {
            alertsDiv.removeChild(alertsDiv.lastChild);
        }
    }

    // Initialize
    window.addEventListener('load', () => {
        loadSensors();
        connect();
    });
</script>
</body>
</html>
