# Application
spring.application.name=sensorguard-gateway
server.port=8080

# PostgreSQL Database (commented for now)
#spring.datasource.url=jdbc:postgresql://localhost:5432/sensorguard
#spring.datasource.username=sensorguard_user
#spring.datasource.password=sensorguard_pass
#spring.datasource.driver-class-name=org.postgresql.Driver

# H2 In-Memory Database (for testing)
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.h2.console.enabled=true

# JPA/Hibernate
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Actuator - Health checks
management.endpoints.web.exposure.include=health,metrics,info
management.endpoint.health.show-details=always
management.metrics.export.simple.enabled=true

# SpringDoc OpenAPI (Swagger)
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.com.sensorguard=DEBUG
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# Python Anomaly Detector Service
anomaly.detector.url=http://localhost:5000